name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk-swift.yml@2ec2db1d8629260420885a5c8a9e0f836cdead6f
    with:
      consumer-module: tools.consumer
  distribution:
    name: SDK distribution checks
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Install tools for standalone consumers and artifacts
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Fetch locked Rust dependencies
        run: mise exec -- cargo fetch --locked
      - name: Validate SDK and consumers
        run: mise exec -- make check-distribution check-rust-consumer check-c-consumer check-dotnet
      - name: Install the pinned wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=wasm-bindgen-0.2.104-aarch64-apple-darwin.tar.gz
          install_dir="$(mktemp -d "$RUNNER_TEMP/wasm-bindgen.XXXXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.104/$archive"
          printf '%s  %s\n' '167c0dd3366b42c3475d8b2f3c97472fecdf98ced4c234ffe6a86ec741f7dad8' "$archive" | shasum -a 256 -c -
          tar -xzf "$archive"
          printf '%s\n' "$install_dir/${archive%.tar.gz}" >> "$GITHUB_PATH"
      - name: Test the installed Web SDK
        run: |
          mise exec -- rustup target add wasm32-unknown-unknown
          mise exec -- cargo fetch --locked --manifest-path bindings/web/rust/Cargo.toml
          mise exec -- make check-web
      - name: Test the installed Web SDK in Chromium
        run: mise exec -- python3 -I -B .github/scripts/check-web-browser.py --artifacts "$RUNNER_TEMP/pointer-gestures-artifacts"
