name: Windows x64 SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Test Rust and .NET
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      GIT_TERMINAL_PROMPT: "0"
      CARGO_BUILD_TARGET: "x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@888bf13f109ac7dc806b29478cc9c4acacdf6515
      - uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.403"
          architecture: x64
      - name: Build native binding libraries
        run: cargo build --locked -p pointer-gesture-recognition-ffi -p pointer-gesture-rendering-ffi
      - name: Test .NET recognition and rendering
        run: |
          $native = Join-Path $PWD "target/$env:CARGO_BUILD_TARGET/debug"
          foreach ($kind in @('Recognition', 'Rendering')) {
            $project = "NaviApps.PointerGestures.$kind.Tests"
            $output = Join-Path $env:RUNNER_TEMP $project
            dotnet build "bindings/dotnet/tests/$project/$project.csproj" --configuration Release --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item (Join-Path $native 'pointer_gesture_recognition_ffi.dll') $output
            Copy-Item (Join-Path $native 'pointer_gesture_rendering_ffi.dll') $output
            dotnet (Join-Path $output "$project.dll")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
