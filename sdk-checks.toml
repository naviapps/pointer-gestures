[swift]
inputs = ["Package.swift", "Sources", "Tests", "Artifacts"]
executables = [
  "RecognitionConsumer",
  "RecognitionMacOSConsumer",
  "RenderingConsumer",
  "RenderingSwiftUIConsumer",
  "RenderingMacOSConsumer",
]
verify_dependencies = true

[nuget]
package_id = "NaviApps.PointerGestures.Rendering"
fixtures = ["fixtures/consumers/dotnet/Recognition.cs", "fixtures/consumers/dotnet/Rendering.cs"]
windows_x64 = true

[windows_bindings]
packages = ["pointer-gesture-recognition-ffi", "pointer-gesture-rendering-ffi"]
projects = [
  "bindings/dotnet/tests/NaviApps.PointerGestures.Recognition.Tests/NaviApps.PointerGestures.Recognition.Tests.csproj",
  "bindings/dotnet/tests/NaviApps.PointerGestures.Rendering.Tests/NaviApps.PointerGestures.Rendering.Tests.csproj",
]
