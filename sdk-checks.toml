[swift]
inputs = ["Package.swift", "Sources", "Tests", "Artifacts"]
executables = [
  "RecognitionConsumer",
  "RecognitionMacOSConsumer",
  "RenderingConsumer",
  "RenderingSwiftUIConsumer",
  "RenderingMacOSConsumer",
]
verify_dependencies = true

[docs]
catalogs = ["Sources/*/*.docc"]
output = ".native-build/docs"
graph_arguments = ["--skip-synthesized-members"]
require_declaration_docs = true
retain_archives = true
