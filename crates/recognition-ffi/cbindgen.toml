language = "C"
style = "type"
include_guard = "POINTER_GESTURE_RECOGNITION_H"
header = "// Generated by cbindgen from the Rust FFI sources.\n// clang-format off"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
line_endings = "LF"
after_includes = """
// Non-null handles are live. Engine access is exclusive. Immutable frame views
// and matcher reads may be shared. The caller owns OS effect delivery.
// Boolean outputs use 0/1. Direction codes are up=1, down=2, left=3, right=4.
// Points use one host coordinate space, increasing rightward and downward."""

[parse]
parse_deps = true
include = ["pointer-gesture-recognition"]

[export.rename]
Config = "PointerGestureRecognitionConfig"
DirectionsView = "PointerGestureRecognitionDirectionsView"
EffectView = "PointerGestureRecognitionEffectView"
Engine = "PointerGestureRecognitionEngine"
Event = "PointerGestureRecognitionEvent"
FrameView = "PointerGestureRecognitionFrameView"
Lookup = "PointerGestureRecognitionLookup"
Matcher = "PointerGestureRecognitionMatcher"
Movement = "PointerGestureRecognitionMovement"
Output = "PointerGestureRecognitionFrame"
PatternValidation = "PointerGestureRecognitionPatternValidation"
Point = "PointerGestureRecognitionPoint"
PointsView = "PointerGestureRecognitionPointsView"
SessionReportView = "PointerGestureRecognitionSessionReportView"
Startup = "PointerGestureRecognitionStartup"
StartupView = "PointerGestureRecognitionStartupView"
TraceView = "PointerGestureRecognitionTraceView"
