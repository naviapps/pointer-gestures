language = "C"
style = "type"
header = """
// Generated by cbindgen from the Rust FFI sources.
// clang-format off"""
include_guard = "POINTER_GESTURE_RECOGNITION_WINDOWS_H"
after_includes = """
#include "../pointer_gesture_recognition.h"
#ifdef _WIN32
typedef struct PointerGestureRecognitionWindowsRecognizer PointerGestureRecognitionWindowsRecognizer;
#endif"""
cpp_compat = true
no_includes = true
documentation_style = "c99"
line_endings = "LF"

[defines]
windows = "_WIN32"

[export.rename]
Config = "PointerGestureRecognitionConfig"
ContextSelection = "PointerGestureRecognitionWindowsContextSelection"
Matcher = "PointerGestureRecognitionMatcher"
Output = "PointerGestureRecognitionFrame"
Point = "PointerGestureRecognitionPoint"
Recognizer = "PointerGestureRecognitionWindowsRecognizer"
ResolveContext = "PointerGestureRecognitionWindowsResolveContext"
WindowsEpoch = "PointerGestureRecognitionWindowsEpoch"
WindowsError = "PointerGestureRecognitionWindowsError"
WindowsPressContext = "PointerGestureRecognitionWindowsPressContext"
