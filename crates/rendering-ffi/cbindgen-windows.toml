language = "C"
style = "type"
header = """
// Generated by cbindgen from the Rust FFI sources.
// clang-format off"""
include_guard = "POINTER_GESTURE_RENDERING_WINDOWS_H"
after_includes = """
#ifdef _WIN32
#include "../pointer_gesture_rendering.h"
typedef struct PointerGestureRenderingWindowsOverlay PointerGestureRenderingWindowsOverlay;
#endif"""
cpp_compat = true
no_includes = true
documentation_style = "c99"
line_endings = "LF"

[defines]
windows = "_WIN32"

[export.rename]
Bounds = "PointerGestureRenderingBounds"
Overlay = "PointerGestureRenderingWindowsOverlay"
OverlayTiming = "PointerGestureRenderingOverlayConfiguration"
TraceHandle = "PointerGestureRenderingTrace"
WindowsOverlayConfiguration = "PointerGestureRenderingWindowsOverlayConfiguration"
WindowsOverlayError = "PointerGestureRenderingWindowsOverlayError"
WindowsOverlayView = "PointerGestureRenderingWindowsOverlayView"
