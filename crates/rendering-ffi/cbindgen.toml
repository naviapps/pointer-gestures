language = "C"
style = "type"
include_guard = "POINTER_GESTURE_RENDERING_H"
header = "// Generated by cbindgen from the Rust FFI sources.\n// clang-format off"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
line_endings = "LF"
after_includes = """
// Input buffers are borrowed only during a call. Non-null buffers must be
// readable for their counts. No callbacks, OS operations or input capture occur.
// Directions use recognition's codes: up=1, down=2, left=3, right=4."""

[parse]
parse_deps = true
include = ["pointer-gesture-recognition", "pointer-gesture-rendering"]

[export.rename]
Bounds = "PointerGestureRenderingBounds"
BoundsResult = "PointerGestureRenderingBoundsResult"
GeometryHandle = "PointerGestureRenderingGeometry"
GeometryResult = "PointerGestureRenderingResult"
GeometryView = "PointerGestureRenderingGeometryView"
NativeCommand = "PointerGestureRenderingCommand"
OverlayFrame = "PointerGestureRenderingOverlayFrame"
OverlayState = "PointerGestureRenderingOverlay"
OverlayTiming = "PointerGestureRenderingOverlayConfiguration"
OverlayView = "PointerGestureRenderingOverlayView"
Point = "PointerGestureRenderingPoint"
TraceConversion = "PointerGestureRenderingTraceConversion"
TraceHandle = "PointerGestureRenderingTrace"
TraceView = "PointerGestureRenderingTraceView"
