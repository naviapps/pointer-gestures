[package]
name = "pointer-gesture-rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
pointer-gesture-recognition = { path = "../recognition" }
tiny-skia = { version = "0.12.0", default-features = false, features = [
  "std",
  "simd",
], optional = true }

[features]
default = []
raster = ["dep:tiny-skia"]

[[bench]]
name = "trace_updates"
harness = false
