[settings]
# Keep the pinned Python ahead of the system copy inside Make recipes.
activate_aggressive = true
idiomatic_version_file_enable_tools = ["rust", "dotnet"]

[tools]
node = "26.13.1"
"npm:typescript" = "7.0.2"
python = "3.15.2"
ruff = "0.17.6"
dprint = "0.65.0"
jactionlint = "2.6.0"
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = { version = "0.13.10", os = ["macos", "linux"] }
"cargo:cbindgen" = "0.29.4"
"github:bnjbvr/cargo-machete" = { version = "0.10.1", platforms.windows-arm64.asset_pattern = "*-x86_64-pc-windows-msvc.tar.gz" }

[tasks.lint]
description = "Check owned source formatting and semantic lint before builds"
run = "mise run sdk-tooling -- quality check --dotnet"

[tasks.format]
description = "Format owned source without changing vendor or artifact bytes"
run = "mise run sdk-tooling -- quality format --dotnet"

[tasks.sdk-tooling]
description = "Run the pinned shared SDK checks"
run = "uvx --from git+https://github.com/naviapps/sdk-tooling.git@6a2a3565996c5711017f17dae15cbc9775dd6313 sdk-tooling"

[tasks.check-web-distribution]
description = "Verify the npm package, reproducibility and browser consumer on Apple Silicon"
tools."github:wasm-bindgen/wasm-bindgen" = { version = "0.2.130", asset_pattern = "wasm-bindgen-0.2.130-aarch64-apple-darwin.tar.gz", checksum = "sha256:b90ddb9357f584b1af897d58ad77e4cce2b48fc17e2a967bc249a87f72809444" }
# The nested SDK Tooling task resets PATH to its own configured tools.
run = 'WASM_BINDGEN_BIN="$(command -v wasm-bindgen)" make check-web check-web-reproducibility check-web-browser'
