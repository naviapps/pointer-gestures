[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  [
    "make",
    "check-distribution",
    "check-rust-consumer",
    "check-c-consumer",
    "check-dotnet",
    "check-consumer",
  ],
  ["rustup", "target", "add", "wasm32-unknown-unknown"],
  ["cargo", "fetch", "--locked", "--manifest-path", "bindings/web/rust/Cargo.toml"],
  [
    "make",
    "check-web",
    "check-web-reproducibility",
    "check-web-browser",
    "BROWSER_ARTIFACTS={temp}/pointer-gestures-artifacts",
  ],
]

[[macos.archives]]
url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.104/wasm-bindgen-0.2.104-aarch64-apple-darwin.tar.gz"
sha256 = "167c0dd3366b42c3475d8b2f3c97472fecdf98ced4c234ffe6a86ec741f7dad8"
bin = "wasm-bindgen-0.2.104-aarch64-apple-darwin"

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  ["sdk-tooling", "python", "-m", "unittest", "discover", "-s", "fixtures/distribution/tests"],
  [
    "sdk-tooling",
    "windows",
    "-m",
    "fixtures.distribution.native_host",
    "--architecture",
    "x86_64",
  ],
]
