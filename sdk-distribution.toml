[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", "check-rust-consumer", "check-c-consumer", "check-dotnet"],
  [
    "sdk-tooling",
    "python",
    "-m",
    "distribution.nuget",
    "pack",
    "--rid",
    "osx-arm64",
    "--rid",
    "osx-x64",
    "--version",
    "0.1.0-local.ci",
    "--output",
    "{temp}/pointer-nuget-feed",
  ],
  [
    "sdk-tooling",
    "python",
    "-m",
    "distribution.nuget",
    "test-package",
    "--rid",
    "osx-arm64",
    "--version",
    "0.1.0-local.ci",
    "--feed",
    "{temp}/pointer-nuget-feed",
  ],
  ["rustup", "target", "add", "wasm32-unknown-unknown"],
  ["cargo", "fetch", "--locked", "--manifest-path", "bindings/web/rust/Cargo.toml"],
  [
    "mise",
    "run",
    "check-web-distribution",
    "--",
    "BROWSER_ARTIFACTS={temp}/pointer-gestures-artifacts",
  ],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  ["sdk-tooling", "python", "-m", "unittest", "discover", "-s", "distribution/tests"],
  [
    "sdk-tooling",
    "windows",
    "-m",
    "distribution.verify_native_host",
    "--architecture",
    "x86_64",
  ],
]
