[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", "check-rust-consumer", "check-c-consumer", "check-dotnet"],
  ["rustup", "target", "add", "wasm32-unknown-unknown"],
  ["cargo", "fetch", "--locked", "--manifest-path", "bindings/web/rust/Cargo.toml"],
  [
    "mise",
    "run",
    "check-web-distribution",
    "--",
    "BROWSER_ARTIFACTS={temp}/pointer-gestures-artifacts",
  ],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["sdk-tooling", "python", "-m", "unittest", "discover", "-s", "distribution/tests"],
  [
    "sdk-tooling",
    "windows",
    "-m",
    "distribution.verify_native_host",
    "--architecture",
    "x86_64",
    "--export-native",
  ],
]

[nuget]
pack = "distribution/pack_nuget.py"
