[macos]
commands = [
  ["cargo", "fetch", "--locked"],
  [
    "make",
    'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"',
    "check-distribution",
    "check-rust-consumer",
    "check-c-consumer",
    "check-dotnet",
  ],
  ["make", 'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"', "check-consumer"],
  ["rustup", "target", "add", "wasm32-unknown-unknown"],
  ["cargo", "fetch", "--locked", "--manifest-path", "bindings/web/rust/Cargo.toml"],
  [
    "make",
    'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"',
    "check-web",
    "check-web-reproducibility",
  ],
  [
    "python3",
    "-I",
    "-B",
    ".github/scripts/check-web-browser.py",
    "--artifacts",
    "{temp}/pointer-gestures-artifacts",
  ],
]

[[macos.archives]]
url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.104/wasm-bindgen-0.2.104-aarch64-apple-darwin.tar.gz"
sha256 = "167c0dd3366b42c3475d8b2f3c97472fecdf98ced4c234ffe6a86ec741f7dad8"
bin = "wasm-bindgen-0.2.104-aarch64-apple-darwin"

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["cargo", "fmt", "--all", "--", "--check"],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "fixtures/distribution/tests",
  ],
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "windows",
    "-m",
    "fixtures.distribution.native_host",
    "--architecture",
    "x86_64",
  ],
]
